<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Quote Board</title>

</head>

<body>
  <div class="container">
    <h1>📜 Daily Quote Board</h1>
    <div class="input-box">
      <input type="text" id="author" placeholder="Your name" />
      <textarea id="content" placeholder="Share a motivational or fun quote..."></textarea>
      <button onclick="postQuote()">Post Quote</button>
    </div>
    <div id="quote-list"></div>
  </div>

</body>

</html>
